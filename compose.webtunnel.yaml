services:
  server:
    networks: [testnet]

  client:
    network_mode: "service:webtunnel-client"
    command: ["/cenkl-replay", "-concurrency", "${WEBTUNNEL_CONCURRENCY:-16}", "-input", "/flows/flows.json", "-endpoint", "${WEBTUNNEL_DESTINATION}:9000", "-server-name", "server", "-socks5", "127.0.0.1:9050", "-ca-cert", "/certs/server-cert.pem"]
    depends_on: [webtunnel-client]

  webtunnel-nginx:
    image: nginx@sha256:1d13701a5f9f3fb01aaa88cef2344d65b6b5bf6b7d9fa4cf0dca557a8d7702ba
    networks:
      testnet:
        ipv4_address: 172.28.0.20
        aliases: [webtunnel-bridge]
    volumes:
      - ${CENKL_UPSTREAM}/testbed/webtunnel/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./work/webtunnel-certs/server.crt:/etc/nginx/ssl/server.crt:ro
      - ./work/webtunnel-certs/server.key:/etc/nginx/ssl/server.key:ro

  webtunnel-server:
    image: thetorproject/webtunnel-bridge@sha256:43a30d0a329562f65f5133ad10c7a9fd25f36a5bcb876d5cd396d2e8588eb7f2
    user: debian-tor
    environment:
      NICKNAME: cenkltestbridge
      PT_PORT: "15000"
      OR_PORT: "9001"
      EMAIL: admin@example.com
      WEBTUNNEL_URL: https://webtunnel-bridge/Sup3rS3cr3tPath
    networks:
      testnet:
        ipv4_address: 172.28.0.21
    volumes:
      - webtunnel-bridge-data:/var/lib/tor

  webtunnel-client:
    image: cenkl-webtunnel-client:local
    command: ["tor", "-f", "/etc/tor/torrc"]
    networks: [testnet]
    volumes:
      - ./work/webtunnel-torrc:/etc/tor/torrc:ro
    depends_on: [webtunnel-nginx, webtunnel-server]

  onion-service:
    image: cenkl-webtunnel-client:local
    entrypoint: ["tor"]
    command: ["-f", "/etc/tor/onionrc"]
    networks: [testnet]
    volumes:
      - ./work/onion-torrc:/etc/tor/onionrc:ro
      - onion-service-data:/var/lib/tor
    depends_on: [server]

  capture:
    image: nicolaka/netshoot:latest
    network_mode: "service:webtunnel-nginx"
    cap_add: [NET_RAW, NET_ADMIN]
    command: ["sh", "-ec", "ethtool -K eth0 tso off gso off gro off tx off rx off; exec tcpdump -i eth0 -U -w /capture/${CAPTURE_FILE} tcp port 443"]
    volumes:
      - ./work:/capture
    depends_on: [webtunnel-nginx]

  netsetup-client:
    image: nicolaka/netshoot:latest
    network_mode: "service:webtunnel-client"
    cap_add: [NET_ADMIN]
    command: ["ethtool", "-K", "eth0", "tso", "off", "gso", "off", "gro", "off", "tx", "off", "rx", "off"]
    depends_on: [webtunnel-client]

volumes:
  webtunnel-bridge-data:
  onion-service-data:

networks:
  testnet:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16
