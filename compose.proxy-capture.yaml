services:
  capture:
    image: nicolaka/netshoot:latest
    network_mode: "service:gost-server"
    cap_add:
      - NET_RAW
      - NET_ADMIN
    command:
      - sh
      - -ec
      - ethtool -K eth0 tso off gso off gro off tx off rx off; exec tcpdump -i eth0 -U -w /capture/${CAPTURE_FILE:-proxy-link.pcap} tcp port 8443
    volumes:
      - ./work:/capture
    depends_on:
      - gost-server

  netsetup-client:
    image: nicolaka/netshoot:latest
    network_mode: "service:gost-client"
    cap_add:
      - NET_ADMIN
    command:
      - ethtool
      - -K
      - eth0
      - tso
      - "off"
      - gso
      - "off"
      - gro
      - "off"
      - tx
      - "off"
      - rx
      - "off"
    depends_on:
      - gost-client
