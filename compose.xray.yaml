services:
  client:
    network_mode: "service:xray-client"
    command: ["/cenkl-replay", "-input", "/flows/flows.json", "-endpoint", "server:9000", "-server-name", "server", "-socks5", "127.0.0.1:${XRAY_SOCKS_PORT:-1083}", "-ca-cert", "/certs/server-cert.pem"]
    depends_on: [xray-client]

  xray-client:
    image: ${XRAY_CLIENT_IMAGE:-ghcr.io/xtls/xray-core@sha256:9e479c59250703491b930da62dd6544bb5207b3372e1d8d6ba300b635b2e4990}
    entrypoint: ["${XRAY_CLIENT_BINARY:-/usr/local/bin/xray}"]
    command: ["run", "-c", "/etc/xray/config.json"]
    volumes:
      - ${CENKL_UPSTREAM}/testbed/${XRAY_CONFIG_DIR:-xray}/client/config.json:/etc/xray/config.json:ro
    depends_on: [xray-server]

  xray-server:
    image: ${XRAY_SERVER_IMAGE:-ghcr.io/xtls/xray-core@sha256:9e479c59250703491b930da62dd6544bb5207b3372e1d8d6ba300b635b2e4990}
    entrypoint: ["/usr/local/bin/xray"]
    command: ["run", "-c", "/etc/xray/config.json"]
    volumes:
      - ${CENKL_UPSTREAM}/testbed/${XRAY_CONFIG_DIR:-xray}/server/config.json:/etc/xray/config.json:ro
      - ${CENKL_UPSTREAM}/testbed/certs:/etc/xray/certs:ro
    networks:
      default:
        aliases: [xray-server-grpc]

  capture:
    image: nicolaka/netshoot:latest
    network_mode: "service:xray-server"
    cap_add: [NET_RAW, NET_ADMIN]
    command: ["sh", "-ec", "ethtool -K eth0 tso off gso off gro off tx off rx off; exec tcpdump -i eth0 -U -w /capture/${CAPTURE_FILE} tcp port ${XRAY_SERVER_PORT:-10002}"]
    volumes:
      - ./work:/capture
    depends_on: [xray-server]

  netsetup-client:
    image: nicolaka/netshoot:latest
    network_mode: "service:xray-client"
    cap_add: [NET_ADMIN]
    command: ["ethtool", "-K", "eth0", "tso", "off", "gso", "off", "gro", "off", "tx", "off", "rx", "off"]
    depends_on: [xray-client]
