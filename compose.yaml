services:
  server:
    build: .
    image: cenkl-record-replay:local
    command:
      - /cenkl-server
      - -listen
      - :9000
      - -cert
      - /certs/server-cert.pem
      - -key
      - /certs/server-key.pem
      - -input
      - /flows/flows.json
    volumes:
      - ${TLS_CERT_FILE:-./work/server-cert.pem}:/certs/server-cert.pem:ro
      - ${TLS_KEY_FILE:-./work/server-key.pem}:/certs/server-key.pem:ro
      - ${FLOW_FILE:-./examples/flows.json}:/flows/flows.json:ro

  client:
    image: cenkl-record-replay:local
    command:
      - /cenkl-replay
      - -input
      - /flows/flows.json
      - -endpoint
      - server:9000
      - -ca-cert
      - /certs/server-cert.pem
    volumes:
      - ${TLS_CERT_FILE:-./work/server-cert.pem}:/certs/server-cert.pem:ro
      - ${FLOW_FILE:-./examples/flows.json}:/flows/flows.json:ro
